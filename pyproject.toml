[project]
name = "wsl-rawdisk"
version = "0.1.0"
description = "Raw physical disk access from WSL2 via a Windows-side proxy"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["pywin32", "wmi"]
client = ["pyfuse3", "pyfuse3-asyncio"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
wsl-rawdisk = "wsl_rawdisk.client.__main__:main"
wsl-rawdisk-server = "wsl_rawdisk.server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsl_rawdisk"]
